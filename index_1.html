<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางสอน โรงเรียนวัดแสนเกษม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: 'Sarabun', sans-serif; background: #eef4fb; color: #1f2a37; padding: 16px; }
  .card { background: #fff; max-width: 440px; width: 100%; border-radius: 16px; padding: 32px 24px;
          text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: #5b6675; margin: 0 0 24px; }
  .btn { display: block; background: #1d5fa8; color: #fff; text-decoration: none; font-size: 1.25rem;
         font-weight: 700; padding: 16px; border-radius: 12px; }
  .btn:active { background: #164a84; }
  ul { text-align: left; color: #3b4654; font-size: .95rem; padding-left: 20px; margin: 24px 0 0; }
  li { margin-bottom: 6px; }
  .foot { margin-top: 20px; font-size: .85rem; color: #7a8594; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem">📅</div>
    <h1>ระบบตารางสอน</h1>
    <p class="sub">โรงเรียนวัดแสนเกษม สำนักงานเขตหนองจอก กรุงเทพมหานคร</p>

    <a class="btn" href="https://script.google.com/macros/s/AKfycbxcOJT-I3bpSGXQphtBv-lC9AHwo0IAcb2WK-7YddeiChbo00rLNEu_ZmaLlG-dPSNj/exec">
      เปิดตารางสอน
    </a>

    <ul>
      <li>ดูตารางสอนรายวัน ตารางครู และการสอนแทน</li>
      <li>ระบบของโรงเรียน ทำงานบน Google</li>
      <li><b>ครูไม่ต้องกรอกรหัสผ่านหรือข้อมูลส่วนตัวใด ๆ</b></li>
    </ul>

    <p class="foot">ดูแลระบบโดยฝ่ายวิชาการ โรงเรียนวัดแสนเกษม</p>
  </div>
</body>
</html>
